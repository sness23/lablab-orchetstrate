<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMYKM AI Cover Art</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0a0a;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .cover-container {
            width: 1200px;
            height: 630px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.3);
        }

        .cover {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0f23 0%, #1a2332 50%, #0f1527 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated network background */
        .network-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
        }

        .network-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, #00d4ff, transparent);
            height: 1px;
            animation: pulse 3s infinite;
        }

        .network-node {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #00d4ff;
            border-radius: 50%;
            box-shadow: 0 0 20px #00d4ff;
            animation: glow 2s infinite;
        }

        /* Main content */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
        }

        .logo-section {
            margin-bottom: 30px;
        }

        .ai-badge {
            display: inline-block;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .title {
            font-size: 72px;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            line-height: 1.1;
            text-shadow: 0 4px 20px rgba(0, 212, 255, 0.5);
        }

        .title .highlight {
            background: linear-gradient(135deg, #00d4ff, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 32px;
            color: #ff6b6b;
            margin: 15px 0;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .tagline {
            font-size: 18px;
            color: #a0a0a0;
            margin: 20px 0;
            font-style: italic;
        }

        /* Agent workflow visualization */
        .workflow {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 40px 0;
        }

        .agent-box {
            background: rgba(22, 33, 62, 0.8);
            border: 1px solid #00d4ff;
            padding: 12px 20px;
            border-radius: 8px;
            color: #00d4ff;
            font-size: 14px;
            font-weight: 600;
            position: relative;
            animation: slideIn 1s ease-out;
            animation-fill-mode: both;
        }

        .agent-box:nth-child(1) { animation-delay: 0.2s; }
        .agent-box:nth-child(2) { animation-delay: 0.4s; }
        .agent-box:nth-child(3) { animation-delay: 0.6s; }
        .agent-box:nth-child(4) { animation-delay: 0.8s; }

        .arrow {
            color: #4ecdc4;
            font-size: 20px;
            animation: pulse 2s infinite;
        }

        /* Metrics section */
        .metrics {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
        }

        .metric {
            text-align: center;
            animation: fadeIn 1.5s ease-out;
            animation-fill-mode: both;
        }

        .metric-value {
            font-size: 36px;
            font-weight: 700;
            color: #4ecdc4;
            margin: 0;
        }

        .metric-label {
            font-size: 12px;
            color: #808080;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* IBM watsonx badge */
        .watsonx-badge {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .watsonx-text {
            color: #00d4ff;
            font-size: 14px;
            font-weight: 600;
        }

        /* Hackathon badge */
        .hackathon-badge {
            position: absolute;
            top: 30px;
            right: 30px;
            background: linear-gradient(135deg, #ff6b6b, #ff5252);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes glow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Download button */
        .download-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            z-index: 100;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="cover-container" id="coverArt">
        <div class="cover">
            <!-- Network background -->
            <div class="network-bg">
                <div class="network-line" style="width: 200px; top: 20%; left: 10%; transform: rotate(45deg);"></div>
                <div class="network-line" style="width: 150px; top: 40%; right: 20%; transform: rotate(-30deg);"></div>
                <div class="network-line" style="width: 180px; bottom: 30%; left: 30%; transform: rotate(60deg);"></div>
                <div class="network-node" style="top: 20%; left: 10%;"></div>
                <div class="network-node" style="top: 40%; right: 20%;"></div>
                <div class="network-node" style="bottom: 30%; left: 30%;"></div>
                <div class="network-node" style="top: 60%; left: 70%;"></div>
                <div class="network-node" style="bottom: 40%; right: 15%;"></div>
            </div>

            <!-- Main content -->
            <div class="content">
                <div class="logo-section">
                    <div class="ai-badge">AI-POWERED</div>
                    <h1 class="title">
                        <span class="highlight">SMYKM</span> AI
                    </h1>
                    <div class="subtitle">Turn Research Papers into Revenue</div>
                    <div class="tagline">Show Me You Know Me • Automated Sales Intelligence for TechBio</div>
                </div>

                <!-- Agent workflow -->
                <div class="workflow">
                    <div class="agent-box">Lead Discovery</div>
                    <div class="arrow">→</div>
                    <div class="agent-box">Profile Builder</div>
                    <div class="arrow">→</div>
                    <div class="agent-box">Product Match</div>
                    <div class="arrow">→</div>
                    <div class="agent-box">SMYKM Outreach</div>
                </div>

                <!-- Key metrics -->
                <div class="metrics">
                    <div class="metric" style="animation-delay: 1s;">
                        <div class="metric-value">36x</div>
                        <div class="metric-label">Faster Research</div>
                    </div>
                    <div class="metric" style="animation-delay: 1.2s;">
                        <div class="metric-value">15%</div>
                        <div class="metric-label">Response Rate</div>
                    </div>
                    <div class="metric" style="animation-delay: 1.4s;">
                        <div class="metric-value">7x</div>
                        <div class="metric-label">Conversion</div>
                    </div>
                </div>
            </div>

            <!-- Badges -->
            <div class="hackathon-badge">IBM HACKATHON</div>
            <div class="watsonx-badge">
                <div class="watsonx-text">Powered by IBM watsonx Orchestrate</div>
            </div>
        </div>
    </div>

    <button class="download-btn" onclick="downloadImage()">Download Cover Art</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        function downloadImage() {
            const element = document.getElementById('coverArt');

            html2canvas(element, {
                scale: 2,
                backgroundColor: null,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'SMYKM_AI_Cover_Art.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        // Add more dynamic nodes
        setTimeout(() => {
            const networkBg = document.querySelector('.network-bg');
            for (let i = 0; i < 5; i++) {
                const node = document.createElement('div');
                node.className = 'network-node';
                node.style.top = Math.random() * 100 + '%';
                node.style.left = Math.random() * 100 + '%';
                node.style.animationDelay = Math.random() * 2 + 's';
                networkBg.appendChild(node);
            }
        }, 100);
    </script>
</body>
</html>
