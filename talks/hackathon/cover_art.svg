<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a2332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1527;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Network background pattern -->
  <g opacity="0.2">
    <!-- Network lines -->
    <line x1="100" y1="100" x2="300" y2="200" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="300" y1="200" x2="500" y2="150" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="500" y1="150" x2="700" y2="250" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="700" y1="250" x2="900" y2="180" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="900" y1="180" x2="1100" y2="220" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>

    <line x1="200" y1="400" x2="400" y2="450" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="400" y1="450" x2="600" y2="380" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="600" y1="380" x2="800" y2="420" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="800" y1="420" x2="1000" y2="480" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>

    <!-- Network nodes -->
    <circle cx="100" cy="100" r="4" fill="#00d4ff" filter="url(#glow)"/>
    <circle cx="300" cy="200" r="4" fill="#00d4ff" filter="url(#glow)"/>
    <circle cx="500" cy="150" r="4" fill="#00d4ff" filter="url(#glow)"/>
    <circle cx="700" cy="250" r="4" fill="#00d4ff" filter="url(#glow)"/>
    <circle cx="900" cy="180" r="4" fill="#00d4ff" filter="url(#glow)"/>
    <circle cx="1100" cy="220" r="4" fill="#00d4ff" filter="url(#glow)"/>

    <circle cx="200" cy="400" r="4" fill="#00d4ff" filter="url(#glow)"/>
    <circle cx="400" cy="450" r="4" fill="#00d4ff" filter="url(#glow)"/>
    <circle cx="600" cy="380" r="4" fill="#00d4ff" filter="url(#glow)"/>
    <circle cx="800" cy="420" r="4" fill="#00d4ff" filter="url(#glow)"/>
    <circle cx="1000" cy="480" r="4" fill="#00d4ff" filter="url(#glow)"/>
  </g>

  <!-- AI-POWERED badge -->
  <g transform="translate(600, 120)">
    <rect x="-60" y="-15" width="120" height="30" rx="15" fill="url(#aiGradient)"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle" letter-spacing="2">AI-POWERED</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="200" font-family="Arial Black, sans-serif" font-size="80" font-weight="700" text-anchor="middle" filter="url(#shadow)">
    <tspan fill="url(#textGradient)">SMYKM</tspan>
    <tspan fill="white" dx="20">AI</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="36" font-weight="300" fill="#ff6b6b" text-anchor="middle">
    Turn Research Papers into Revenue
  </text>

  <!-- Tagline -->
  <text x="600" y="290" font-family="Arial, sans-serif" font-size="18" fill="#a0a0a0" text-anchor="middle" font-style="italic">
    Show Me You Know Me • Automated Sales Intelligence for TechBio
  </text>

  <!-- Agent Workflow -->
  <g transform="translate(600, 370)">
    <!-- Agent boxes -->
    <g transform="translate(-400, 0)">
      <rect x="-70" y="-20" width="140" height="40" rx="8" fill="rgba(22, 33, 62, 0.8)" stroke="#00d4ff" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#00d4ff" text-anchor="middle">Lead Discovery</text>
    </g>

    <text x="-230" y="5" font-family="Arial, sans-serif" font-size="24" fill="#4ecdc4" text-anchor="middle">→</text>

    <g transform="translate(-130, 0)">
      <rect x="-70" y="-20" width="140" height="40" rx="8" fill="rgba(22, 33, 62, 0.8)" stroke="#00d4ff" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#00d4ff" text-anchor="middle">Profile Builder</text>
    </g>

    <text x="40" y="5" font-family="Arial, sans-serif" font-size="24" fill="#4ecdc4" text-anchor="middle">→</text>

    <g transform="translate(140, 0)">
      <rect x="-70" y="-20" width="140" height="40" rx="8" fill="rgba(22, 33, 62, 0.8)" stroke="#00d4ff" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#00d4ff" text-anchor="middle">Product Match</text>
    </g>

    <text x="310" y="5" font-family="Arial, sans-serif" font-size="24" fill="#4ecdc4" text-anchor="middle">→</text>

    <g transform="translate(410, 0)">
      <rect x="-70" y="-20" width="140" height="40" rx="8" fill="rgba(22, 33, 62, 0.8)" stroke="#00d4ff" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#00d4ff" text-anchor="middle">SMYKM Outreach</text>
    </g>
  </g>

  <!-- Metrics -->
  <g transform="translate(600, 480)">
    <!-- 36x Faster -->
    <g transform="translate(-200, 0)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#4ecdc4" text-anchor="middle">36x</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="#808080" text-anchor="middle" letter-spacing="1">FASTER RESEARCH</text>
    </g>

    <!-- 15% Response -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#4ecdc4" text-anchor="middle">15%</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="#808080" text-anchor="middle" letter-spacing="1">RESPONSE RATE</text>
    </g>

    <!-- 7x Conversion -->
    <g transform="translate(200, 0)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#4ecdc4" text-anchor="middle">7x</text>
      <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="#808080" text-anchor="middle" letter-spacing="1">CONVERSION</text>
    </g>
  </g>

  <!-- IBM Hackathon Badge -->
  <g transform="translate(1050, 50)">
    <rect x="-60" y="-15" width="120" height="30" rx="6" fill="#ff6b6b"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle" letter-spacing="1">IBM HACKATHON</text>
  </g>

  <!-- watsonx Badge -->
  <g transform="translate(1000, 570)">
    <rect x="-120" y="-20" width="240" height="40" rx="8" fill="rgba(0, 0, 0, 0.5)" stroke="rgba(0, 212, 255, 0.3)" stroke-width="1"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#00d4ff" text-anchor="middle">Powered by IBM watsonx Orchestrate</text>
  </g>

  <!-- Decorative elements -->
  <g opacity="0.3">
    <!-- DNA-like helix representing research/science -->
    <path d="M 50 100 Q 70 150, 50 200 T 50 300" stroke="#4ecdc4" stroke-width="2" fill="none"/>
    <path d="M 70 100 Q 50 150, 70 200 T 70 300" stroke="#4ecdc4" stroke-width="2" fill="none"/>

    <!-- Circuit pattern representing AI -->
    <g transform="translate(1100, 300)">
      <rect x="0" y="0" width="4" height="30" fill="#00d4ff"/>
      <rect x="-10" y="30" width="24" height="4" fill="#00d4ff"/>
      <rect x="10" y="34" width="4" height="20" fill="#00d4ff"/>
      <rect x="-10" y="34" width="4" height="20" fill="#00d4ff"/>
      <circle cx="2" cy="0" r="4" fill="#00d4ff"/>
      <circle cx="-10" cy="54" r="4" fill="#00d4ff"/>
      <circle cx="14" cy="54" r="4" fill="#00d4ff"/>
    </g>
  </g>
</svg>